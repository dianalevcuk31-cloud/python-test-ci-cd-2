name: CI Pipeline

on:
  push:
    branches: [ "main" ] # Запуск при пуше в основную ветку
  pull_request:
    branches: [ "main" ] # Запуск при создании/обновлении PR

jobs:

  #Тестирование
 
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Важно! Если упадет 3.11, тест на 3.12 продолжит работу
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем проект в editable режиме + зависимости для тестов
          pip install -e ".[test]"

      - name: Run tests
        run: |
          # Запускаем тесты. Если тест упадет, шаг завершится с ошибкой.
          pytest tests/

 
  #Сборка и запуск

  build-and-run:
    name: Build and Run Flaskr
    needs: test # Запускается только если все тесты в matrix прошли успешно
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      #  Сборка wheel и tar.gz 
      - name: Build package (wheel and sdist)
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist/ # Для проверки, что файлы появились

      #  Создание отдельного venv и установка wheel 
      - name: Create venv and install wheel
        run: |
          # Создаем отдельное виртуальное окружение
          python -m venv venv_install
          source venv_install/bin/activate
          
          # Устанавливаем собранный wheel-пакет (он подтянет зависимости Flask)
          # Берем первый попавшийся .whl из папки dist
          pip install dist/*.whl

      # Установка Flaskr с сохранением версии Flask из wheel 
      - name: Install Flaskr
        run: |
          source venv_install/bin/activate
          cd examples/tutorial
          # Устанавливаем Flaskr без обновления зависимостей (--no-deps),
          # чтобы сохранить версию Flask, установленную из нашего wheel
          pip install -e . --no-deps

      # Инициализация БД и запуск приложения
      - name: Initialize DB and Run App
        run: |
          source venv_install/bin/activate
          cd examples/tutorial
          
          # Инициализация базы данных Flaskr
          flask --app flaskr init-db
          
          # Запуск приложения на 5000 порту в фоне (чтобы job не завис)
          # Используем nohup и &, чтобы команда завершилась
          nohup flask --app flaskr run --port 5000 &
          
          # Ждем пару секунд, чтобы сервер точно поднялся
          sleep 5
          
          # Проверяем, что приложение отвечает (опционально, но полезно для проверки)
          curl -s http://127.0.0.1:5000/ | head -n 5 || echo "Server is running (или вернул ошибку, но процесс жив)"
