name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
 
  #  1: Тестирование (Матрица Python)
 
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest "pytest<9" asgiref

      - name: Run tests
        run: |
          pytest tests/ -v --deselect tests/test_reqctx.py::test_bad_environ_raises_bad_request
        env:
          PYTHONPATH: src


  #  2: Сборка и запуск
 
  build-and-run:
    name: Build and Run Flaskr
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package (wheel and sdist)
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist/

      - name: Create venv and install wheel
        run: |
          python -m venv venv_install
          source venv_install/bin/activate
          pip install dist/*.whl

      - name: Install Flaskr
        run: |
          source venv_install/bin/activate
          cd examples/tutorial
          pip install -e . --no-deps

      - name: Initialize DB and Run App
        run: |
          source venv_install/bin/activate
          cd examples/tutorial
          
          flask --app flaskr init-db
          
          nohup flask --app flaskr run --port 5000 &
          
          sleep 5
          
          curl -s http://127.0.0.1:5000/ || echo "Сервер запущен!"
